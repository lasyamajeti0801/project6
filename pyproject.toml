[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot"
version = "1.0.0"
description = "StockPilot — Intelligent Warehouse & Inventory Management System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "StockPilot Core Team", email = "engineer@stockpilot.in" },
    { name = "Lasya Majeti", email = "lasyamajeti0801@gmail.com" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=backend.apps --cov-report=term-missing"
testpaths = [
    "tests",
    "backend/tests"
]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "stockpilot.settings"

[tool.coverage.run]
source = ["backend/apps"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
