[pytest]
DJANGO_SETTINGS_MODULE = stockpilot.settings
pythonpath = backend
python_files = test_*.py *_tests.py tests.py
addopts = -v --tb=short --cov=apps --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:coverage_html
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
