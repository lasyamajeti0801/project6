[pytest]
DJANGO_SETTINGS_MODULE = stockpilot.settings
pythonpath = backend
python_files = test_*.py *_tests.py tests.py
addopts = -v --tb=short --cov=apps.catalog --cov=apps.inventory --cov=apps.warehouses --cov=apps.procurement --cov=apps.sales --cov=apps.dispatch --cov=apps.forecasting --cov=apps.accounts --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:coverage_html
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
